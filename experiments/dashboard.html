function makeChart(id, title, trainKey, valKey) {
  const ctx = document.getElementById(id).getContext('2d');
  const datasets = [];
  if (trainKey && M.train[trainKey]) {
    datasets.push({
      label: 'Train', data: M.train[trainKey], borderColor: '#3b82f6',
      backgroundColor: 'rgba(59,130,246,0.1)', borderWidth: 1.5, pointRadius: 0, fill: false,
    });
  }
  if (valKey && M.val[valKey]) {
    datasets.push({
      label: 'Val', data: M.val[valKey], borderColor: '#f97316',
      backgroundColor: 'rgba(249,115,22,0.1)', borderWidth: 1.5, pointRadius: 0, fill: false,
    });
  }
  const chart = new Chart(ctx, {
    type: 'line',
    data: { labels: epochs, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#ccc', font: { size: 10 } } },
        zoom: {
          pan: { enabled: true, mode: 'xy' },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: 'xy',
          },
        },
      },
      scales: {
        x: { ticks: { color: '#888' }, grid: { color: '#222' } },
        y: { ticks: { color: '#888' }, grid: { color: '#222' } },
      },
      animation: false,
    },
  });
  document.getElementById(id).addEventListener('dblclick', () => chart.resetZoom());
}

        borderWidth: 1.5, pointRadius: 0, fill: false,
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#ccc', font: { size: 10 } } },
        zoom: {
          pan: { enabled: true, mode: 'xy' },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: 'xy',
          },
        },
      },
      scales: {
        x: { ticks: { color: '#888' }, grid: { color: '#222' } },
        y: { ticks: { color: '#888' }, grid: { color: '#222' } },
      },
      animation: false,
    },
  });
  document.getElementById('c_lr').addEventListener('dblclick', () => chart.resetZoom());
}
