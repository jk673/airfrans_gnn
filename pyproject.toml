[project]
name = "airfrans-gnn"
version = "0.1.0"
description = "AirfRANS GNN training pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.4.0",
    "torch-geometric==2.7.0",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "wandb",
    "ipykernel",
    "psutil",
    "notebook",
]

[project.optional-dependencies]
optuna = [
    "optuna",
    "joblib",
]
test = [
    "pytest",
]
all = [
    "airfrans-gnn[optuna,test]",
]

[tool.uv]
extra-index-url = [
    "https://download.pytorch.org/whl/cu124",
]

[tool.uv.sources]
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_scatter-2.1.2%2Bpt24cu124-cp311-cp311-linux_x86_64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_sparse-0.6.18%2Bpt24cu124-cp311-cp311-linux_x86_64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_cluster-1.6.3%2Bpt24cu124-cp311-cp311-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-sparse = ["torch"]
torch-cluster = ["torch"]
